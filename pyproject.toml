[project]
name = "duobench"
version = "0.1.0"
description = "Cost-efficiency benchmark for planner-implementer LLM duos via Pi RPC"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alejandro AO" },
]
keywords = ["llm", "benchmark", "agents", "cost", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "playwright>=1.49",
    "matplotlib>=3.9",
    "pillow>=11.0",
    "rich>=13.9",
]

[project.urls]
Homepage = "https://github.com/alejandro-ao/agent-synergy-eval"
Repository = "https://github.com/alejandro-ao/agent-synergy-eval"
Issues = "https://github.com/alejandro-ao/agent-synergy-eval/issues"

[project.scripts]
duobench = "duobench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duobench"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
