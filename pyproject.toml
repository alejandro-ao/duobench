[project]
name = "duobench"
version = "0.1.0"
description = "Cost-efficiency benchmark for planner-implementer LLM duos via Pi RPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "playwright>=1.49",
    "matplotlib>=3.9",
    "pillow>=11.0",
    "rich>=13.9",
]

[project.scripts]
duobench = "duobench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duobench"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
