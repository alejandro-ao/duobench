[project]
name = "kcbench"
version = "0.1.0"
description = "Model-agnostic benchmark for planner-implementer agent pairings via Pi RPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "playwright>=1.49",
    "matplotlib>=3.9",
    "pillow>=11.0",
]

[project.scripts]
kcbench = "kcbench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kcbench"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
