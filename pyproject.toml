[project]
name = "duobench"
version = "0.1.0"
description = "Cost-efficiency benchmark for planner-implementer LLM duos via Pi RPC"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alejandro AO" },
]
license = "Apache-2.0"
keywords = ["llm", "benchmark", "agents", "cost", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/alejandro-ao/duobench"
Repository = "https://github.com/alejandro-ao/duobench"
Issues = "https://github.com/alejandro-ao/duobench/issues"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/duobench/src"]
